server:
  port: 8080

spring:
  application:
    name: village-os-backend

  datasource:
    url: jdbc:h2:file:./data/village_os;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-prefix:

# JWT 配置
jwt:
  secret: YTk3ZDI4ZjFiMjM0NTY3ODkwYWJjZGVmMDEyMzQ1Njc4OTBhYmNkZWYwMTIzNDU2Nzg5MGFiY2RlZjAxMjM0
  expiration: 86400000  # 24小时

# 日志
logging:
  level:
    com.village.os: debug
