<style>
  /* Demo-specific overrides */
  body { padding: 24px; }
  .demo-section { margin-bottom: 32px; }
  .demo-section h2 { font-size: var(--fs-h2); color: var(--text-white); margin-bottom: 16px; letter-spacing:1px; }

<body>

<div class="dashboard">
  <!-- Header -->
  <div class="dashboard-header">
    <div class="title">📋 中堰村 · 村委班子</div>
    <div class="actions">
      <button class="btn btn-primary" onclick="alert('新增干部')">➕ 新增干部</button>
    </div>
  </div>

  <!-- Stats Row -->
  <div class="demo-section">
    <h2>📊 统计卡片</h2>
    <div class="dashboard-stats">
      <div class="stat-card"><div class="value">6</div><div class="label">干部总数</div><div class="sub">两委班子</div></div>
      <div class="stat-card"><div class="value green">139</div><div class="label">本月事项</div><div class="sub">↑12%</div></div>
      <div class="stat-card"><div class="value amber">93%</div><div class="label">综合满意率</div></div>
      <div class="stat-card"><div class="value blue">10</div><div class="label">本月留言</div></div>
    </div>
  </div>

  <!-- Cadre Grid -->
  <div class="demo-section">
    <h2>👥 干部卡片</h2>
    <div class="grid grid-auto" id="cadreGrid">
      <!-- Filled by JS -->
    </div>
  </div>

  <!-- Tags -->
  <div class="demo-section">
    <h2>🏷️ 职务标签</h2>
    <span class="tag tag-green">村两委</span>
    <span class="tag tag-blue">党总支部</span>
    <span class="tag tag-amber">监委会</span>
    <span class="tag tag-purple">村民代表</span>
    <span class="tag tag-dim">已离职</span>
  </div>
</div>
