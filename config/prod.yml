# ============================================
# 数字乡村平台 - 生产环境配置
# ============================================
# 敏感信息通过环境变量注入，禁止明文写在配置文件中

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 20
          max-idle: 20

jwt:
  secret: ${JWT_SECRET}
  expiration: 7200000  # 2小时

logging:
  level:
    com.village.os: warn
  file:
    path: ./logs
    name: backend.log
