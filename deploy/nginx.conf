# ============================================================
#  数字乡村平台 · nginx 配置
#  用法：
#    1. 把下面 root 改成 dist 实际路径
#    2. 把 server_name 改成你的域名或 IP
#    3. 将本文件 include 到 nginx.conf，或直接替换 server 段
# ============================================================

server {
    listen 80;
    server_name _;    # 改成你的域名 / 局域网 IP / 公网 IP

    # ---------- 前端静态资源（frontend/dist 目录） ----------
    root /path/to/village-os/frontend/dist;
    index index.html;

    # 前端路由回退（SPA：/dashboard /login /admin 等刷新时仍返回 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端 API 反向代理（前端 /api/* 转发到后端 8080） ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- WebSocket（实时推送，如有用到） ----------
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ---------- 大模型 AI 代理（可选，需 DeepSeek API Key；启用时取消注释） ----------
    # location /deepseek/ {
    #     proxy_pass https://api.deepseek.com/;
    #     proxy_set_header Host api.deepseek.com;
    # }
}
